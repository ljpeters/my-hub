services:
  web:
    restart: always
    build:
      context: app
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    ports:
      - '8000:8000'
    network_mode: host
    privileged: true
    volumes:
      - /root/.cache/pip:/root/.cache/pip
